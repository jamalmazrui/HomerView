[Hotkeys]
Launch HomerView=Alt+NVDA+H, Launches or reconnects the HomerView copy of Microsoft Edge. H for HomerView, and it works anywhere because nothing is running yet.
Alternate Menu=Alt+NVDA+F10, Presents every command that applies right now in a single alphabetical list. F10 opens a menu bar in Windows, and this is the menu HomerView has instead.
Hotkey Summary=Alt+Shift+H, Shows every command name, key and description as a page you can search. H for Hotkey.
User Guide=F1, Opens the guide to every command. F1 is help, everywhere.
Quick Start=Control+F1, Opens the first ten minutes of HomerView, for someone new to it. One of the F1 family, because it is documentation.
History of Changes=Shift+F1, Shows what changed in each release, newest first.
About HomerView=Alt+F1, Says which version this is and where HomerView keeps its files.
Developer Notes=Alt+Shift+F1, Opens the notes on how HomerView is built and why.
Session Log=Control+Shift+F1, Opens a copy of this session's log, for working out what went wrong.
Jump to Main=J, or Alt+NVDA+J, Jumps to the main content the page declares. J for Jump, and it is one of only three letters NVDA leaves free in a page.
Jump to Probable Main=Shift+J, Finds the main content of a page that declares none, by weighing every part of it, and says that it inferred rather than was told.
Next Sentence=Alt+DownArrow, Moves to the next sentence and reads it. Alt with an arrow moves by something larger than a line and smaller than a paragraph.
Prior Sentence=Alt+UpArrow, Moves to the previous sentence and reads it.
Next Paragraph=Control+DownArrow, Moves to the next paragraph and reads it. Control with an arrow moves by paragraph in Word and in most editors.
Prior Paragraph=Control+UpArrow, Moves to the previous paragraph and reads it.
Next Same Kind=Z, Moves to the next thing of the same kind as the one you are on, whatever that is. Z because NVDA leaves it free, and JAWS does this with S.
Prior Same Kind=Shift+Z, Moves to the previous thing of the same kind as the one you are on.
Next Different Kind=Alt+Z, Moves to the next thing of a different kind, which JAWS does with D.
Prior Different Kind=Alt+Shift+Z, Moves to the previous thing of a different kind.
Go to Percent=Control+G, Moves to a percentage point through the page. G for Go, as Control+G goes to a place in most editors.
Go Again=Alt+G, Moves to the percentage used last time, or a step further with plus or minus.
Find Text=Control+F, Opens NVDA's own find, so the dialog and its behaviour are the ones you already know. F for Find.
Find Backwards=Control+Shift+F, Finds the same way but searches backwards. Shift reverses a direction here as it does everywhere.
Find Pattern=Control+F3, Finds a regular expression, which NVDA's own find cannot do. On F3 because it belongs to the finding family.
Find Pattern Backwards=Control+Shift+F3, Finds a regular expression, searching backwards.
Find Again=F3, Repeats the last search, plain or pattern, without asking again. F3 repeats a find in every Windows program.
Find Again Backwards=Shift+F3, Repeats the last search in the opposite direction.
Find Word=Alt+W, Finds the next place the word under the cursor appears. W for Word.
Find Word Backwards=Alt+Shift+W, Finds the previous place the word under the cursor appears.
List Headings=NVDA+F6, Lists the page's headings, as the JAWS heading list does.
List Form Fields=NVDA+F5, Lists the page's form fields, as the JAWS form field list does.
List Links=NVDA+Shift+F7, Lists the page's links, as the JAWS link list does.
List Elements=Alt+NVDA+L, Lists any kind of element, including kinds NVDA's own Elements List does not offer. L for List.
Explore Page=Y, or Alt+NVDA+E, Describes how the page is laid out, including what a sighted person can see that your reading order never mentions. E for Explore; Y is a second key because NVDA leaves it free.
Say Address=Alt+A, Says the web address of this page. Twice spells it, three times copies it. A for Address.
Say Address Anywhere=Alt+NVDA+U, Says the web address from anywhere in the window, including the address bar.
Say Name=Alt+N, Says the name of the page, and spells it when pressed twice. N for Name.
Say Metadata=Alt+M, Says what the page claims about itself: author, publisher, date and licence. M for Metadata.
Say Position=Alt+Delete, or Alt+NumPadDelete, Says the line, column and percentage position of the cursor. Delete sits among the navigation keys, which is where a position question belongs.
Say Yield=Alt+Y, Says how many characters, words and lines the page or the selection holds. Y for Yield, as in EdSharp.
Say Yield Structure=Alt+Shift+Y, Says how the page is built: how many headings, links, forms and the rest.
Say Yield Pattern=Control+Shift+Y, Counts how often a regular expression matches, which answers how many rather than where.
Say Link=Alt+L, Says where the link under the cursor would go. L for Link.
Say Link Target=Alt+Shift+L, Asks what is actually at that link without going there: what kind of thing, how big, and whether it ends up where it claims.
Page Links=Alt+P, Copies every link address on the page to the clipboard. P for Page.
Say Time=Alt+SemiColon, Says the time, and the date when pressed twice.
Read All=Alt+F8, Reads the whole page without moving the cursor.
Read Rest=Alt+R, Reads from the cursor to the end without moving it. R for Rest.
Toggle Reading=ScrollLock, Starts reading continuously, or stops if it is already reading. Scroll Lock because nothing else in Edge, NVDA or Windows wants it.
Say Selected=Shift+Space, Says the selected text, and spells it when pressed twice.
Say Chunk=Shift+Backspace, Says the run of non-blank characters at the cursor, and spells it when pressed twice.
Start Selection=F8, Marks where a selection begins, so Shift need not be held while you move. F8 starts a selection in EdSharp and in Word.
Complete Selection=Shift+F8, Selects from the marked start to wherever the cursor now is.
Go to Selection Start=Alt+Shift+F8, Returns to where the selection was started.
Select Chunk=Control+Space, Selects the run of non-blank characters at the cursor, then the next one.
Copy All=Control+F8, Copies the whole page to the clipboard.
Copy Line=Control+C, Copies the selection, or the whole line when nothing is selected.
Copy Append=Alt+C, Adds the selection, or the line, to what is already on the clipboard.
Say Clipboard=Alt+Apostrophe, Says what is on the clipboard, and spells it when pressed twice. The apostrophe is a quotation mark, and a clipboard holds a quotation.
Save Clipboard=Control+Apostrophe, Saves the clipboard to a text file, proposing a name.
Append Clipboard=Control+Shift+Apostrophe, Adds the clipboard to the end of a text file rather than replacing it.
Clear Clipboard=Alt+Shift+Apostrophe, Empties the clipboard, so an append starts afresh.
Open Document=Control+O, Opens a Word file, spreadsheet, slide deck, PDF or ebook, converting it to a page so every command here works on it. Control+O opens in every program; this one opens more.
Save Page=Control+S, or Alt+Control+S, Saves the page in any of nine formats. Control+S saves in every program; this one saves more ways.
Extract Main Content=Shift+F9, Extracts the readable part of the page into a page of its own that you can search, save or send. F9 is Edge's own reading view, and Shift+F9 is HomerView's, which works on pages Edge will not.
Fetch Files=Alt+NVDA+F, Lists the kinds of file linked from the page and downloads the ones you choose. F for Fetch.
Submit Form=Control+Enter, Submits the form you are filling in, from any field in it, so you need not find the button.
Invoke Script=Alt+I, Carries out instructions written in ordinary words, such as click sign in. I for Invoke.
Check Accessibility=Alt+NVDA+A, Tests the page for accessibility problems, asking which engine to use, and offers to report what it finds to whoever publishes the site. A for Accessibility.
Consult Copilot=Alt+NVDA+C, Copies the page text and opens Edge's Copilot sidebar, ready for a question. C for Copilot.
Query Web=Alt+Q, or Alt+NVDA+Q, Looks something up using free services that need no account: a definition, a place, the weather, a book. Q for Query.
Dismiss Dialog=Alt+NVDA+D, Closes a browser dialog that is blocking the window. D for Dismiss, and it works anywhere because a dialog is what has the focus.
Tab List=F4, Lists the HomerView tabs and switches to the one you choose. F4 is the Homer window list, and Edge has two other keys for what F4 does there.
Tab Names=Shift+F4, Says the names of the open tabs without moving the keyboard anywhere.
Tab Close Others=Control+Shift+F4, Closes every tab but the one you are reading. Control+F4 closes one tab, so Control+Shift+F4 closes the rest.
Speak Faster=Control+Accent, Speaks faster. The accent key carries the whole speech family.
Speak Slower=Control+Shift+Accent, Speaks slower.
Speak Louder=Alt+Accent, Speaks louder.
Speak Softer=Alt+Shift+Accent, Speaks more softly.
Toggle Punctuation=Alt+Control+Accent, Switches punctuation between all and none.
Speech Settings=Shift+Accent, Reports the punctuation level, the rate and the volume.
Elevate Version=Control+F11, or Alt+NVDA+F11, Checks whether a newer HomerView exists and installs it.
Recent Pages=Alt+NVDA+R, Lists what you have opened in HomerView and when, so you can find it again. R for Recent.
Report Connection=None, Says whether HomerView is connected to the browser, and how.
Self Test=None, Checks that all three ways of reaching the browser are working.

; Reached from within another command rather than by a key of their own.
Report Accessibility=None, Tests the page and writes a report addressed to whoever publishes the site. Reached by Check Accessibility once an engine is chosen.
Check with Axe=None, Tests the page with Deque's axe-core engine. Offered by Check Accessibility.
Check with Equal Access=None, Tests the page with IBM's Equal Access engine. Offered by Check Accessibility.
Open User Guide=None, Opens the user guide in the HomerView window rather than as a message.
Open History=None, Opens the history of changes in the HomerView window.
