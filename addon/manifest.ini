name = "homerView"
summary = "HomerView"
description = "Drives a dedicated instance of Microsoft Edge through the Chrome DevTools Protocol, so that NVDA can work with the page as the browser itself sees it. Summarises a page including what is on screen but absent from the reading order, tests it with axe-core or the IBM Equal Access engine and finds how to report the problems to its publisher, opens Word, Excel, PowerPoint, PDF, EPUB and other documents by converting them, saves a page as a web page, Markdown, text, Word, PDF or an image, downloads linked files, and adds the Homer reading, selection, clipboard and search commands. Press NVDA+Alt+F10 for every command."
author = "Jamal Mazrui (https://github.com/JamalMazrui)"
version = "1.48.36"
minimumNVDAVersion = "2025.1"
lastTestedNVDAVersion = "2026.1.1"
url = "https://github.com/JamalMazrui/HomerView"
docFileName = "readme.html"
